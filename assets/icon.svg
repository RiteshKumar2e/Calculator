<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!-- Background -->
  <rect width="192" height="192" fill="#1a1a1a" rx="30"/>
  
  <!-- Calculator body -->
  <rect x="24" y="24" width="144" height="144" fill="#222" rx="8"/>
  
  <!-- Display -->
  <rect x="32" y="32" width="128" height="32" fill="#111" rx="4"/>
  <text x="96" y="56" font-size="24" font-weight="bold" fill="#ff9500" text-anchor="middle" font-family="Arial">123</text>
  
  <!-- Button grid -->
  <!-- Row 1 -->
  <rect x="32" y="72" width="28" height="24" fill="#ff9500" rx="3"/>
  <text x="46" y="88" font-size="14" fill="#fff" text-anchor="middle" font-family="Arial" font-weight="bold">C</text>
  
  <rect x="64" y="72" width="28" height="24" fill="#ff9500" rx="3"/>
  <text x="78" y="88" font-size="14" fill="#fff" text-anchor="middle" font-family="Arial" font-weight="bold">/</text>
  
  <rect x="96" y="72" width="28" height="24" fill="#ff9500" rx="3"/>
  <text x="110" y="88" font-size="14" fill="#fff" text-anchor="middle" font-family="Arial" font-weight="bold">×</text>
  
  <rect x="128" y="72" width="28" height="24" fill="#4CAF50" rx="3"/>
  <text x="142" y="88" font-size="14" fill="#fff" text-anchor="middle" font-family="Arial" font-weight="bold">=</text>
  
  <!-- Row 2 -->
  <rect x="32" y="100" width="28" height="24" fill="#333" rx="3"/>
  <text x="46" y="116" font-size="14" fill="#fff" text-anchor="middle" font-family="Arial" font-weight="bold">7</text>
  
  <rect x="64" y="100" width="28" height="24" fill="#333" rx="3"/>
  <text x="78" y="116" font-size="14" fill="#fff" text-anchor="middle" font-family="Arial" font-weight="bold">8</text>
  
  <rect x="96" y="100" width="28" height="24" fill="#333" rx="3"/>
  <text x="110" y="116" font-size="14" fill="#fff" text-anchor="middle" font-family="Arial" font-weight="bold">9</text>
  
  <rect x="128" y="100" width="28" height="24" fill="#ff9500" rx="3"/>
  <text x="142" y="116" font-size="14" fill="#fff" text-anchor="middle" font-family="Arial" font-weight="bold">-</text>
  
  <!-- Row 3 -->
  <rect x="32" y="128" width="28" height="24" fill="#333" rx="3"/>
  <text x="46" y="144" font-size="14" fill="#fff" text-anchor="middle" font-family="Arial" font-weight="bold">1</text>
  
  <rect x="64" y="128" width="28" height="24" fill="#333" rx="3"/>
  <text x="78" y="144" font-size="14" fill="#fff" text-anchor="middle" font-family="Arial" font-weight="bold">0</text>
  
  <rect x="96" y="128" width="28" height="24" fill="#333" rx="3"/>
  <text x="110" y="144" font-size="14" fill="#fff" text-anchor="middle" font-family="Arial" font-weight="bold">.</text>
  
  <rect x="128" y="128" width="28" height="24" fill="#ff9500" rx="3"/>
  <text x="142" y="144" font-size="14" fill="#fff" text-anchor="middle" font-family="Arial" font-weight="bold">+</text>
</svg>