<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <!-- Background -->
  <rect width="180" height="180" fill="#1a1a1a" rx="30"/>
  
  <!-- Calculator body -->
  <rect x="20" y="20" width="140" height="140" fill="#222" rx="8"/>
  
  <!-- Display -->
  <rect x="28" y="28" width="124" height="30" fill="#111" rx="4"/>
  <text x="90" y="50" font-size="20" font-weight="bold" fill="#ff9500" text-anchor="middle" font-family="Arial">123</text>
  
  <!-- Button grid -->
  <!-- Row 1 -->
  <rect x="28" y="66" width="26" height="22" fill="#ff9500" rx="3"/>
  <text x="41" y="81" font-size="12" fill="#fff" text-anchor="middle" font-family="Arial" font-weight="bold">C</text>
  
  <rect x="58" y="66" width="26" height="22" fill="#ff9500" rx="3"/>
  <text x="71" y="81" font-size="12" fill="#fff" text-anchor="middle" font-family="Arial" font-weight="bold">/</text>
  
  <rect x="88" y="66" width="26" height="22" fill="#ff9500" rx="3"/>
  <text x="101" y="81" font-size="12" fill="#fff" text-anchor="middle" font-family="Arial" font-weight="bold">×</text>
  
  <rect x="118" y="66" width="26" height="22" fill="#4CAF50" rx="3"/>
  <text x="131" y="81" font-size="12" fill="#fff" text-anchor="middle" font-family="Arial" font-weight="bold">=</text>
  
  <!-- Row 2 -->
  <rect x="28" y="92" width="26" height="22" fill="#333" rx="3"/>
  <text x="41" y="107" font-size="12" fill="#fff" text-anchor="middle" font-family="Arial" font-weight="bold">7</text>
  
  <rect x="58" y="92" width="26" height="22" fill="#333" rx="3"/>
  <text x="71" y="107" font-size="12" fill="#fff" text-anchor="middle" font-family="Arial" font-weight="bold">8</text>
  
  <rect x="88" y="92" width="26" height="22" fill="#333" rx="3"/>
  <text x="101" y="107" font-size="12" fill="#fff" text-anchor="middle" font-family="Arial" font-weight="bold">9</text>
  
  <rect x="118" y="92" width="26" height="22" fill="#ff9500" rx="3"/>
  <text x="131" y="107" font-size="12" fill="#fff" text-anchor="middle" font-family="Arial" font-weight="bold">-</text>
  
  <!-- Row 3 -->
  <rect x="28" y="118" width="26" height="22" fill="#333" rx="3"/>
  <text x="41" y="133" font-size="12" fill="#fff" text-anchor="middle" font-family="Arial" font-weight="bold">1</text>
  
  <rect x="58" y="118" width="26" height="22" fill="#333" rx="3"/>
  <text x="71" y="133" font-size="12" fill="#fff" text-anchor="middle" font-family="Arial" font-weight="bold">0</text>
  
  <rect x="88" y="118" width="26" height="22" fill="#333" rx="3"/>
  <text x="101" y="133" font-size="12" fill="#fff" text-anchor="middle" font-family="Arial" font-weight="bold">.</text>
  
  <rect x="118" y="118" width="26" height="22" fill="#ff9500" rx="3"/>
  <text x="131" y="133" font-size="12" fill="#fff" text-anchor="middle" font-family="Arial" font-weight="bold">+</text>
</svg>